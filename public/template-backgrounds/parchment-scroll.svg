<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Paper Texture -->
    <filter id="parchment-texture">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="4" result="noise" />
      <feColorMatrix type="matrix" values="1 0 0 0 0.88  0 1 0 0 0.82  0 0 1 0 0.70  0 0 0 0.12 0" in="noise" result="coloredNoise" />
      <feBlend in="SourceGraphic" in2="coloredNoise" mode="multiply" />
    </filter>

    <!-- Drop Shadow for the Scroll Body -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.5" flood-color="#2a1a08" />
    </filter>

    <!-- Scroll Edge Gradient -->
    <linearGradient id="scroll-edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a67b27" />
      <stop offset="4%" stop-color="#cfab63" />
      <stop offset="12%" stop-color="#ebe0c5" />
      <stop offset="88%" stop-color="#ebe0c5" />
      <stop offset="96%" stop-color="#cfab63" />
      <stop offset="100%" stop-color="#a67b27" />
    </linearGradient>

    <!-- 3D Wood Cylinder Gradient -->
    <linearGradient id="wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b261b" />
      <stop offset="20%" stop-color="#855a3d" />
      <stop offset="45%" stop-color="#b07d5b" />
      <stop offset="70%" stop-color="#855a3d" />
      <stop offset="100%" stop-color="#24140b" />
    </linearGradient>

    <!-- Inner Shadow for Rolls -->
    <linearGradient id="roll-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#553a21" stop-opacity="0.6"/>
      <stop offset="10%" stop-color="#553a21" stop-opacity="0"/>
      <stop offset="90%" stop-color="#553a21" stop-opacity="0"/>
      <stop offset="100%" stop-color="#553a21" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Top Wood Roller -->
  <g filter="url(#drop-shadow)">
    <rect x="40" y="15" width="720" height="42" fill="url(#wood)" rx="5" ry="5" />
    <rect x="30" y="10" width="16" height="52" fill="#523827" rx="4" ry="4" stroke="#2b1a10" stroke-width="2"/>
    <rect x="754" y="10" width="16" height="52" fill="#523827" rx="4" ry="4" stroke="#2b1a10" stroke-width="2"/>
  </g>

  <!-- Bottom Wood Roller -->
  <g filter="url(#drop-shadow)">
    <rect x="40" y="943" width="720" height="42" fill="url(#wood)" rx="5" ry="5" />
    <rect x="30" y="938" width="16" height="52" fill="#523827" rx="4" ry="4" stroke="#2b1a10" stroke-width="2"/>
    <rect x="754" y="938" width="16" height="52" fill="#523827" rx="4" ry="4" stroke="#2b1a10" stroke-width="2"/>
  </g>

  <!-- Parchment Body -->
  <g filter="url(#drop-shadow)">
    <g filter="url(#parchment-texture)">
      <!-- Smooth, gently curling edges -->
      <path d="M 100 35 C 250 5, 550 75, 700 35 L 700 965 C 550 995, 250 925, 100 965 Z" fill="url(#scroll-edge)" />
      
      <!-- Fold creases and edge details -->
      <path d="M 125 50 Q 400 90 675 50 L 675 950 Q 400 910 125 950 Z" fill="url(#roll-shadow)" />
      
      <!-- Drawn inner lines to emulate scroll rolling bounds -->
      <path d="M 130 65 Q 400 85 670 65 L 670 935 Q 400 915 130 935 Z" fill="none" stroke="#a6835a" stroke-width="2" opacity="0.6" />
      <path d="M 140 75 Q 400 95 660 75 L 660 925 Q 400 905 140 925 Z" fill="none" stroke="#7a5530" stroke-width="1" stroke-dasharray="10 4" opacity="0.4" />
    </g>
  </g>
</svg>