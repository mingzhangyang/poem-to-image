<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="paperBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6e7c7"/>
      <stop offset="46%" stop-color="#e8cfa0"/>
      <stop offset="100%" stop-color="#c79f67"/>
    </linearGradient>
    <radialGradient id="cornerBurn" cx="50%" cy="50%" r="70%">
      <stop offset="62%" stop-color="rgba(74,43,20,0)"/>
      <stop offset="100%" stop-color="rgba(74,43,20,0.56)"/>
    </radialGradient>
    <radialGradient id="centerLift" cx="52%" cy="42%" r="58%">
      <stop offset="0%" stop-color="rgba(255,244,217,0.48)"/>
      <stop offset="100%" stop-color="rgba(255,244,217,0)"/>
    </radialGradient>
    <filter id="paperNoise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="37" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.11"/>
      </feComponentTransfer>
    </filter>
    <filter id="creaseNoise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.19" numOctaves="2" seed="12" result="grain"/>
      <feColorMatrix in="grain" type="matrix" values="
        0 0 0 0 0.27
        0 0 0 0 0.18
        0 0 0 0 0.09
        0 0 0 0.5 0
      "/>
    </filter>
  </defs>

  <rect width="1200" height="1600" fill="url(#paperBase)"/>
  <rect width="1200" height="1600" fill="url(#centerLift)"/>
  <rect width="1200" height="1600" filter="url(#paperNoise)"/>
  <rect width="1200" height="1600" filter="url(#creaseNoise)" opacity="0.65"/>

  <g opacity="0.24" fill="#7b5a34">
    <ellipse cx="182" cy="264" rx="94" ry="68"/>
    <ellipse cx="1018" cy="318" rx="126" ry="74"/>
    <ellipse cx="234" cy="1310" rx="108" ry="84"/>
    <ellipse cx="1000" cy="1264" rx="122" ry="92"/>
    <ellipse cx="624" cy="1018" rx="160" ry="44"/>
  </g>

  <g stroke="#4d3016" stroke-opacity="0.16" fill="none" stroke-linecap="round">
    <path d="M142 118 C272 154 410 136 522 176 C668 228 816 182 1040 208"/>
    <path d="M96 1440 C252 1376 376 1422 560 1368 C742 1314 930 1372 1090 1320"/>
    <path d="M166 422 C342 452 552 396 754 438 C880 464 972 446 1074 468"/>
  </g>

  <rect width="1200" height="1600" fill="url(#cornerBurn)" opacity="0.5"/>
</svg>
