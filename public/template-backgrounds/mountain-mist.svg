<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f9f4"/>
      <stop offset="60%" stop-color="#dbe6db"/>
      <stop offset="100%" stop-color="#aabfaa"/>
    </linearGradient>
    
    <linearGradient id="mountBack" x1="0" y1="0.4" x2="0" y2="1">
      <stop offset="0%" stop-color="#809c8a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#cedecd" stop-opacity="0.1"/>
    </linearGradient>
    
    <linearGradient id="mountFront" x1="0" y1="0.5" x2="0" y2="1">
      <stop offset="0%" stop-color="#556e5f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#95ac9d" stop-opacity="0.3"/>
    </linearGradient>

    <radialGradient id="mist1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="mist2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8eee8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e8eee8" stop-opacity="0"/>
    </radialGradient>

    <filter id="blurLarge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="1600" height="2000" fill="url(#sky)"/>

  <!-- Back Mountains -->
  <path fill="url(#mountBack)" d="M 0 1360 Q 115 1170 230 980 Q 325 1105 420 1230 Q 550 1070 680 910 Q 810 1075 940 1240 Q 1060 1085 1180 930 Q 1320 1095 1460 1260 Q 1530 1190 1600 1120 L 1600 2000 L 0 2000 Z" />

  <!-- Back Mist Layer -->
  <ellipse cx="600" cy="1200" rx="900" ry="250" fill="url(#mist1)" filter="url(#blurLarge)"/>

  <!-- Front Mountains -->
  <path fill="url(#mountFront)" d="M 0 1500 Q 90 1380 180 1260 Q 300 1340 420 1420 Q 560 1300 700 1180 Q 840 1330 980 1480 Q 1115 1370 1250 1260 Q 1370 1380 1490 1500 Q 1545 1460 1600 1420 L 1600 2000 L 0 2000 Z" />

  <!-- Front Mist Layer -->
  <ellipse cx="1000" cy="1450" rx="800" ry="300" fill="url(#mist2)" filter="url(#blurLarge)"/>
  <ellipse cx="300" cy="1550" rx="700" ry="200" fill="url(#mist1)" filter="url(#blurLarge)"/>

  <!-- Decorative stylized topographic lines -->
  <g stroke="#324437" stroke-opacity="0.12" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M 80 1540 Q 250 1450 420 1540 T 760 1540" />
    <path d="M 820 1580 Q 1000 1490 1180 1580 T 1520 1580" />
    <path d="M -50 1660 Q 150 1570 350 1660 T 750 1660 T 1150 1660 T 1650 1660" />
  </g>
</svg>
