<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E3E9EC"/>
      <stop offset="100%" stop-color="#F1F5F7"/>
    </linearGradient>
    <linearGradient id="mount1-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8A969E" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#E3E9EC" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="mount2-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67747D" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F1F5F7" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="mount3-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#465158" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F1F5F7" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#223333" stop-opacity="0.06"/>
    </radialGradient>
    <filter id="ink-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Base Sky and Water -->
  <rect width="800" height="600" fill="url(#bg-grad)"/>

  <!-- Distant Ink Wash Mountains (Left Side) -->
  <path d="M 0 0 Q 150 20 280 150 Q 380 250 420 380 Q 450 500 480 600 L 0 600 Z" fill="url(#mount1-grad)" filter="url(#ink-blur)"/>
  
  <!-- Midground Ink Wash Mountains -->
  <path d="M 0 100 Q 100 120 180 250 Q 250 350 280 480 Q 300 550 320 600 L 0 600 Z" fill="url(#mount2-grad)" filter="url(#ink-blur)"/>
  
  <!-- Foreground Ink Wash Cliffs -->
  <path d="M 0 250 Q 80 280 120 400 Q 150 480 180 600 L 0 600 Z" fill="url(#mount3-grad)" filter="url(#ink-blur)"/>

  <!-- Suble River Water Lines (Empty Space Context) -->
  <g stroke="#A8B5BC" stroke-width="1.2" opacity="0.4" stroke-linecap="round" filter="url(#soft-blur)">
    <path d="M 380 420 L 460 420"/>
    <path d="M 650 450 L 760 450"/>
    <path d="M 320 470 L 400 470"/>
    <path d="M 700 510 L 780 510"/>
    <path d="M 260 550 L 360 550"/>
    <path d="M 420 580 L 520 580"/>
  </g>

  <!-- Boat Reflection -->
  <ellipse cx="600" cy="515" rx="55" ry="6" fill="#5A6872" opacity="0.2" filter="url(#soft-blur)"/>

  <!-- Fisherman and Boat -->
  <g id="fisherman-scene">
    <!-- Boat Hull -->
    <path d="M 530 500 Q 600 520 680 490 Q 665 503 600 510 Q 550 503 530 500 Z" fill="#353D44"/>
    <!-- Boat Interior Rim -->
    <path d="M 535 499 Q 600 515 670 491" fill="none" stroke="#191D22" stroke-width="1.5"/>
    
    <!-- Snow overlay on Boat -->
    <path d="M 540 500 Q 600 515 660 492 Q 600 510 540 500 Z" fill="#FFFFFF" opacity="0.85" filter="url(#soft-blur)"/>
    
    <!-- Fisherman Cape (蓑衣) -->
    <path d="M 605 493 C 595 470 615 455 625 490 Z" fill="#262B31"/>
    <!-- Cape Texture -->
    <path d="M 608 475 L 605 490 M 613 470 L 612 490 M 618 470 L 620 490" stroke="#16191C" stroke-width="1" opacity="0.8"/>
    
    <!-- Fisherman Hat (斗笠) -->
    <path d="M 595 463 Q 610 450 625 463 Q 610 459 595 463 Z" fill="#1B1F24"/>
    
    <!-- Snow on Cape -->
    <path d="M 610 463 Q 600 475 608 485 Q 612 470 618 463 Z" fill="#FFFFFF" opacity="0.75" filter="url(#soft-blur)"/>
    
    <!-- Snow on Hat -->
    <path d="M 598 461 Q 610 453 622 461 Q 610 457 598 461 Z" fill="#FFFFFF" opacity="0.9" filter="url(#soft-blur)"/>
    
    <!-- Fishing Rod -->
    <path d="M 610 470 Q 550 445 480 480" fill="none" stroke="#181C21" stroke-width="1.5"/>
    <!-- Fishing Line -->
    <path d="M 480 480 L 480 525" fill="none" stroke="#181C21" stroke-width="0.8" stroke-dasharray="3,2"/>
    
    <!-- Water Ripples where line enters -->
    <ellipse cx="480" cy="525" rx="10" ry="2.5" fill="none" stroke="#87959C" stroke-width="1" opacity="0.7"/>
    <ellipse cx="480" cy="525" rx="20" ry="4.5" fill="none" stroke="#87959C" stroke-width="0.5" opacity="0.4"/>
  </g>

  <!-- Bottom Left Snow Bank for framing -->
  <path d="M 0 550 Q 100 540 150 600 L 0 600 Z" fill="#FFFFFF" opacity="0.8" filter="url(#soft-blur)"/>

  <!-- Falling Snow (Scattered white circles) -->
  <g fill="#FFFFFF">
    <circle cx="50" cy="80" r="2" opacity="0.8"/>
    <circle cx="120" cy="150" r="1.5" opacity="0.6"/>
    <circle cx="200" cy="40" r="2.5" opacity="0.7"/>
    <circle cx="310" cy="110" r="2" opacity="0.5"/>
    <circle cx="420" cy="60" r="3" opacity="0.9"/>
    <circle cx="550" cy="130" r="1.5" opacity="0.4"/>
    <circle cx="680" cy="70" r="2.5" opacity="0.8"/>
    <circle cx="750" cy="180" r="2" opacity="0.6"/>
    <circle cx="80" cy="280" r="1.5" opacity="0.7"/>
    <circle cx="170" cy="340" r="3" opacity="0.5"/>
    <circle cx="260" cy="220" r="2" opacity="0.8"/>
    <circle cx="350" cy="290" r="1.5" opacity="0.6"/>
    <circle cx="480" cy="210" r="2.5" opacity="0.9"/>
    <circle cx="590" cy="270" r="2" opacity="0.5"/>
    <circle cx="710" cy="320" r="1.5" opacity="0.7"/>
    <circle cx="780" cy="250" r="2" opacity="0.8"/>
    <circle cx="100" cy="450" r="2.5" opacity="0.6"/>
    <circle cx="220" cy="520" r="1.5" opacity="0.5"/>
    <circle cx="330" cy="410" r="2" opacity="0.8"/>
    <circle cx="450" cy="380" r="1.5" opacity="0.7"/>
    <circle cx="520" cy="470" r="3" opacity="0.9"/>
    <circle cx="650" cy="390" r="2" opacity="0.6"/>
    <circle cx="730" cy="480" r="2.5" opacity="0.8"/>
    <circle cx="140" cy="560" r="2" opacity="0.4"/>
    <circle cx="280" cy="490" r="3" opacity="0.7"/>
    <circle cx="390" cy="540" r="1.5" opacity="0.8"/>
    <circle cx="570" cy="550" r="2" opacity="0.5"/>
    <circle cx="690" cy="570" r="1.5" opacity="0.9"/>
    <circle cx="770" cy="410" r="2.5" opacity="0.6"/>
    <circle cx="30" cy="380" r="2" opacity="0.8"/>
    <circle cx="490" cy="110" r="1.5" opacity="0.5"/>
    <circle cx="620" cy="80" r="2" opacity="0.7"/>
    <circle cx="190" cy="180" r="2.5" opacity="0.6"/>
    <circle cx="410" cy="250" r="2" opacity="0.8"/>
    <circle cx="510" cy="340" r="1.5" opacity="0.9"/>
    <circle cx="640" cy="200" r="3" opacity="0.4"/>
  </g>

  <!-- Subtle Vignette Overlay for Atmospheric Depth -->
  <rect width="800" height="600" fill="url(#vignette)" pointer-events="none"/>
</svg>