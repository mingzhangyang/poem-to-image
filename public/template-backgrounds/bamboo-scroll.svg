<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bamboo-slat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2a059" />
      <stop offset="15%" stop-color="#d9b973" />
      <stop offset="50%" stop-color="#e6c981" />
      <stop offset="85%" stop-color="#d9b973" />
      <stop offset="100%" stop-color="#a6803c" />
    </linearGradient>
    <linearGradient id="bamboo-edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c4000" />
      <stop offset="50%" stop-color="#8b6508" />
      <stop offset="100%" stop-color="#5c4000" />
    </linearGradient>
    <filter id="bamboo-texture">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.01" numOctaves="2" result="noise" />
      <feColorMatrix type="matrix" values="1 0 0 0 0.9  0 1 0 0 0.8  0 0 1 0 0.5  0 0 0 0.1 0" in="noise" result="coloredNoise" />
      <feBlend in="SourceGraphic" in2="coloredNoise" mode="multiply" />
    </filter>
  </defs>
  <rect width="800" height="600" fill="#8b6508" />
  <pattern id="slats" width="40" height="600" patternUnits="userSpaceOnUse">
    <rect x="1" y="0" width="38" height="600" fill="url(#bamboo-slat)" rx="2" ry="2" filter="url(#bamboo-texture)" />
    <line x1="0" y1="0" x2="0" y2="600" stroke="#5c4000" stroke-width="1.5" />
    <path d="M 1 150 Q 20 145 39 150" fill="none" stroke="#8b6508" stroke-width="1.5" opacity="0.7"/>
    <path d="M 1 300 Q 20 305 39 300" fill="none" stroke="#8b6508" stroke-width="1.5" opacity="0.7"/>
    <path d="M 1 450 Q 20 145 39 450" fill="none" stroke="#8b6508" stroke-width="1.5" opacity="0.7"/>
  </pattern>
  <rect width="800" height="600" fill="url(#slats)" />
  <g stroke-dasharray="6,4">
    <line x1="0" y1="100" x2="800" y2="100" stroke="#3a2000" stroke-width="3" />
    <line x1="0" y1="103" x2="800" y2="103" stroke="#6b4a1b" stroke-width="1.5" />
    <line x1="0" y1="300" x2="800" y2="300" stroke="#3a2000" stroke-width="3" />
    <line x1="0" y1="303" x2="800" y2="303" stroke="#6b4a1b" stroke-width="1.5" />
    <line x1="0" y1="500" x2="800" y2="500" stroke="#3a2000" stroke-width="3" />
    <line x1="0" y1="503" x2="800" y2="503" stroke="#6b4a1b" stroke-width="1.5" />
  </g>
  <rect x="0" y="0" width="800" height="24" fill="url(#bamboo-edge)" />
  <rect x="0" y="576" width="800" height="24" fill="url(#bamboo-edge)" />
</svg>