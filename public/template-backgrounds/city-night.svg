<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#02040f"/>
      <stop offset="50%" stop-color="#0b122e"/>
      <stop offset="100%" stop-color="#0f193f"/>
    </linearGradient>
    <radialGradient id="cityGlow" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="2000" fill="url(#sky)"/>
  
  <!-- Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="150" cy="180" r="1.5" />
    <circle cx="340" cy="320" r="2" opacity="0.8" />
    <circle cx="680" cy="150" r="1" />
    <circle cx="890" cy="400" r="2.5" opacity="0.5" />
    <circle cx="1120" cy="220" r="1.5" />
    <circle cx="1380" cy="110" r="2" />
    <circle cx="1450" cy="450" r="1" />
  </g>

  <!-- Atmospheric Horizon Glow -->
  <rect width="1600" height="2000" fill="url(#cityGlow)"/>

  <!-- Buildings Background Layer -->
  <g fill="#070a1a">
    <rect x="-50" y="850" width="180" height="1150" />
    <rect x="180" y="980" width="140" height="1020" />
    <rect x="360" y="780" width="220" height="1220" />
    <rect x="640" y="910" width="160" height="1090" />
    <rect x="920" y="800" width="180" height="1200" />
    <rect x="1220" y="950" width="150" height="1050" />
    <rect x="1450" y="820" width="200" height="1180" />
  </g>

  <!-- Buildings Foreground Layer -->
  <g fill="#0a1024">
    <rect x="40" y="990" width="190" height="1010" />
    <rect x="210" y="870" width="250" height="1130" />
    <rect x="430" y="1030" width="210" height="970" />
    <rect x="610" y="820" width="260" height="1180" />
    <rect x="850" y="930" width="220" height="1070" />
    <rect x="1020" y="760" width="300" height="1240" />
    <rect x="1300" y="1010" width="250" height="990" />
  </g>

  <!-- Neon Windows (Cyan) -->
  <g fill="#22d3ee" filter="url(#neonGlow)">
    <rect x="248" y="940" width="26" height="16"/>
    <rect x="286" y="940" width="26" height="16"/>
    <rect x="324" y="940" width="26" height="16"/>
    
    <rect x="650" y="890" width="30" height="100"/>
    <rect x="694" y="890" width="30" height="100"/>
    
    <rect x="1080" y="840" width="10" height="30"/>
    <rect x="1126" y="840" width="10" height="30"/>
    <rect x="1172" y="840" width="10" height="30"/>
  </g>

  <!-- Neon Windows (Magenta) -->
  <g fill="#d946ef" filter="url(#neonGlow)">
    <rect x="260" y="1000" width="20" height="13"/>
    <rect x="698" y="1030" width="26" height="20"/>
    <rect x="1114" y="902" width="22" height="13"/>
    <rect x="1340" y="1050" width="40" height="10"/>
  </g>

  <!-- Dark Base -->
  <rect y="1650" width="1600" height="350" fill="#03050d" opacity="0.85"/>
</svg>
