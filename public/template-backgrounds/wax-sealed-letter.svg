<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4e4c4"/>
      <stop offset="55%" stop-color="#e3c79a"/>
      <stop offset="100%" stop-color="#c99f72"/>
    </linearGradient>
    <radialGradient id="lift" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="rgba(255,247,229,0.55)"/>
      <stop offset="100%" stop-color="rgba(255,247,229,0)"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="64%" stop-color="rgba(81,48,26,0)"/>
      <stop offset="100%" stop-color="rgba(81,48,26,0.52)"/>
    </radialGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="16"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.1"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="1600" fill="url(#paper)"/>
  <rect width="1200" height="1600" fill="url(#lift)"/>
  <rect width="1200" height="1600" filter="url(#grain)"/>

  <g stroke="#6e4327" stroke-opacity="0.2" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M140 198 C330 246 518 176 720 226 C876 262 986 250 1060 284"/>
    <path d="M108 1398 C282 1330 444 1384 662 1324 C840 1276 984 1322 1094 1268"/>
  </g>

  <g stroke="#7b4d2e" stroke-opacity="0.26" stroke-width="2.5" fill="none">
    <line x1="188" y1="474" x2="1012" y2="474"/>
    <line x1="188" y1="548" x2="1012" y2="548"/>
    <line x1="188" y1="622" x2="1012" y2="622"/>
    <line x1="188" y1="696" x2="1012" y2="696"/>
  </g>

  <g opacity="0.65">
    <circle cx="934" cy="1220" r="118" fill="#9c3029"/>
    <circle cx="912" cy="1202" r="50" fill="#c65c4f" opacity="0.58"/>
    <circle cx="976" cy="1254" r="34" fill="#7a1f1a" opacity="0.44"/>
  </g>

  <rect width="1200" height="1600" fill="url(#vignette)"/>
</svg>
