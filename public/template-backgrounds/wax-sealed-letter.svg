<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <filter id="paper-texture">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="1 0 0 0 0.95  0 1 0 0 0.92  0 0 1 0 0.88  0 0 0 0.1 0" in="noise" result="coloredNoise" />
      <feBlend in="SourceGraphic" in2="coloredNoise" mode="multiply" />
    </filter>
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.3" />
    </filter>
    <radialGradient id="wax-gradient" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ff3333" />
      <stop offset="50%" stop-color="#cc0000" />
      <stop offset="90%" stop-color="#880000" />
      <stop offset="100%" stop-color="#440000" />
    </radialGradient>
  </defs>
  <rect x="100" y="100" width="600" height="400" fill="#fdf5e6" filter="url(#paper-texture)" />
  <path d="M 100 500 L 400 320 L 700 500 Z" fill="#f5e6d3" filter="url(#paper-texture)" stroke="#d2b48c" stroke-width="2" />
  <path d="M 100 100 L 400 320 L 100 500 Z" fill="#f0e0cc" filter="url(#paper-texture)" stroke="#d2b48c" stroke-width="2" />
  <path d="M 700 100 L 400 320 L 700 500 Z" fill="#f0e0cc" filter="url(#paper-texture)" stroke="#d2b48c" stroke-width="2" />
  <g filter="url(#drop-shadow)">
    <path d="M 100 100 L 400 320 L 700 100 Z" fill="#faebd7" filter="url(#paper-texture)" stroke="#d2b48c" stroke-width="2" />
  </g>
  <g filter="url(#drop-shadow)">
    <circle cx="400" cy="320" r="45" fill="url(#wax-gradient)" />
  </g>
  <circle cx="400" cy="320" r="38" fill="none" stroke="#660000" stroke-width="2" opacity="0.5"/>
  <path d="M 385 310 Q 400 295 415 310 Q 410 330 400 340 Q 390 330 385 310 Z" fill="#ff6666" opacity="0.4" />
  <text x="400" y="335" font-family="serif" font-size="40" font-weight="bold" font-style="italic" fill="#660000" text-anchor="middle" opacity="0.8">W</text>
</svg>