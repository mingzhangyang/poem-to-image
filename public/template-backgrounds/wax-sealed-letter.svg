<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Paper Texture -->
    <filter id="paper-texture">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="1 0 0 0 0.95  0 1 0 0 0.92  0 0 1 0 0.88  0 0 0 0.1 0" in="noise" result="coloredNoise" />
      <feBlend in="SourceGraphic" in2="coloredNoise" mode="multiply" />
    </filter>

    <!-- Drop Shadow for Envelope -->
    <filter id="drop-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25" flood-color="#4a3e2e" />
    </filter>

    <!-- Shadow for Inner Flaps -->
    <filter id="inner-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.15" />
    </filter>

    <!-- Deep Wax Gradient -->
    <radialGradient id="wax-gradient" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="30%" stop-color="#d91a1a" />
      <stop offset="70%" stop-color="#8c0000" />
      <stop offset="100%" stop-color="#3d0000" />
    </radialGradient>

    <!-- 3D Gradients for Envelope Flaps -->
    <linearGradient id="envelopeBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf5e6" />
      <stop offset="100%" stop-color="#faead2" />
    </linearGradient>

    <linearGradient id="flapBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5e6d3" />
      <stop offset="100%" stop-color="#e8d1b3" />
    </linearGradient>

    <linearGradient id="flapSide1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f3e0c7" />
      <stop offset="100%" stop-color="#e6cdad" />
    </linearGradient>

    <linearGradient id="flapSide2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6cdad" />
      <stop offset="100%" stop-color="#f3e0c7" />
    </linearGradient>

    <linearGradient id="flapTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff9f0" />
      <stop offset="100%" stop-color="#e6cdad" />
    </linearGradient>
  </defs>

  <g filter="url(#drop-shadow)">
    <!-- Base Envelope -->
    <rect x="100" y="100" width="600" height="400" fill="url(#envelopeBack)" filter="url(#paper-texture)" />
    
    <!-- Bottom Flap -->
    <path d="M 100 500 L 400 320 L 700 500 Z" fill="url(#flapBottom)" filter="url(#paper-texture)" stroke="#c2a480" stroke-width="1" />
    
    <!-- Left Flap -->
    <path d="M 100 100 L 400 320 L 100 500 Z" fill="url(#flapSide1)" filter="url(#paper-texture)" stroke="#c2a480" stroke-width="1" />
    
    <!-- Right Flap -->
    <path d="M 700 100 L 400 320 L 700 500 Z" fill="url(#flapSide2)" filter="url(#paper-texture)" stroke="#c2a480" stroke-width="1" />
    
    <!-- Top Flap (closes over the others) -->
    <g filter="url(#inner-shadow)">
      <path d="M 100 100 L 400 320 L 700 100 Z" fill="url(#flapTop)" filter="url(#paper-texture)" stroke="#c2a480" stroke-width="1.5" />
    </g>

    <!-- Organic Melted Wax Seal -->
    <g filter="url(#drop-shadow)">
      <!-- Main irregular blob -->
      <path d="M 380 270 C 420 260, 445 275, 450 310 C 455 345, 435 365, 395 370 C 365 375, 345 350, 350 315 C 355 280, 350 275, 380 270 Z" fill="url(#wax-gradient)" />
      
      <!-- Wax Drips -->
      <circle cx="435" cy="378" r="4.5" fill="#8c0000" />
      <circle cx="442" cy="385" r="2.5" fill="#5c0000" />
      <circle cx="365" cy="375" r="3.5" fill="#3d0000" />
      <path d="M 405 370 Q 410 385 408 395 Q 402 385 398 370 Z" fill="#6c0000" />
    </g>

    <!-- Wax Inner Depressed Ring -->
    <path d="M 385 285 C 415 280, 430 295, 432 320 C 435 345, 420 355, 392 358 C 370 360, 358 340, 360 315 C 362 290, 360 288, 385 285 Z" fill="none" stroke="#5c0000" stroke-width="2.5" opacity="0.65"/>
    
    <!-- Wax Stamped Letter -->
    <path d="M 385 305 Q 400 290 415 305 Q 410 325 400 335 Q 390 325 385 305 Z" fill="#ff6666" opacity="0.3" />
    <text x="400" y="338" font-family="Georgia, serif" font-size="44" font-weight="bold" font-style="italic" fill="#3a0000" text-anchor="middle" opacity="0.9">W</text>
  </g>
</svg>