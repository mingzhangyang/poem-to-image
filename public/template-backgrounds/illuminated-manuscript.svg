<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="parchment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#efe0b9"/>
      <stop offset="52%" stop-color="#dcc18c"/>
      <stop offset="100%" stop-color="#b69059"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8e7a7"/>
      <stop offset="50%" stop-color="#cf9f42"/>
      <stop offset="100%" stop-color="#8a6622"/>
    </linearGradient>
    <radialGradient id="center" cx="50%" cy="48%" r="62%">
