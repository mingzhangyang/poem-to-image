<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Vellum Background Gradient -->
    <linearGradient id="vellum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8eb" />
      <stop offset="40%" stop-color="#fcf0d4" />
      <stop offset="85%" stop-color="#ebd499" />
      <stop offset="100%" stop-color="#d6b872" />
    </linearGradient>

    <!-- Rich Metallic Gold -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c59838" />
      <stop offset="15%" stop-color="#ffdf33" />
      <stop offset="35%" stop-color="#fff8dc" />
      <stop offset="60%" stop-color="#e6b83c" />
      <stop offset="85%" stop-color="#ffdf33" />
      <stop offset="100%" stop-color="#996e1a" />
    </linearGradient>

    <!-- Celtic Knot Pattern -->
    <pattern id="knotPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0 20 L 20 0 M 20 40 L 40 20 M 0 20 L 20 40 M 20 0 L 40 20" stroke="url(#gold)" stroke-width="2" fill="none" opacity="0.35"/>
      <circle cx="20" cy="20" r="14" stroke="#8b0000" stroke-width="1.5" fill="none" opacity="0.2"/>
    </pattern>

    <!-- Parchment Texture Overlay -->
    <filter id="parchment">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="1 0 0 0 0.93  0 1 0 0 0.89  0 0 1 0 0.82  0 0 0 0.1 0" in="noise" result="coloredNoise" />
      <feBlend in="SourceGraphic" in2="coloredNoise" mode="multiply" />
    </filter>
  </defs>

  <!-- Base Page -->
  <rect width="800" height="1000" fill="url(#vellum)" filter="url(#parchment)" />
  
  <!-- Outer Decorative Border Layer -->
  <rect x="36" y="36" width="728" height="928" fill="none" class="gold-frame" stroke="url(#gold)" stroke-width="20" />
  
  <!-- Inner Border Filling with Celtic Knots -->
  <rect x="46" y="46" width="708" height="908" fill="none" stroke="url(#knotPattern)" stroke-width="16" />

  <!-- Structuring Lines -->
  <rect x="56" y="56" width="688" height="888" fill="none" stroke="#8b0000" stroke-width="4" />
  <rect x="64" y="64" width="672" height="872" fill="none" stroke="#00008b" stroke-width="2" />
  <rect x="24" y="24" width="752" height="952" fill="none" stroke="#00008b" stroke-width="2.5" />
  <rect x="20" y="20" width="760" height="960" fill="none" stroke="#3d0303" stroke-width="1.5" />

  <!-- Elaborate Corner Embellishments -->
  <g stroke="url(#gold)" stroke-width="8">
    <circle cx="46" cy="46" r="34" fill="#8b0000" />
    <circle cx="754" cy="46" r="34" fill="#00008b" />
    <circle cx="46" cy="954" r="34" fill="#00008b" />
    <circle cx="754" cy="954" r="34" fill="#8b0000" />
  </g>

  <!-- Solid Inner Jewels -->
  <circle cx="46" cy="46" r="14" fill="url(#gold)" />
  <circle cx="754" cy="46" r="14" fill="url(#gold)" />
  <circle cx="46" cy="954" r="14" fill="url(#gold)" />
  <circle cx="754" cy="954" r="14" fill="url(#gold)" />

  <!-- Detailed Initial Letter/Picture Box Embellishment -->
  <g transform="translate(100, 100)">
    <!-- Backdrop Drop Shadow -->
    <rect x="-8" y="-8" width="196" height="196" fill="#8b0000" rx="8" ry="8" opacity="0.4"/>
    <rect x="0" y="0" width="190" height="190" fill="url(#gold)" rx="8" ry="8" />
    <rect x="8" y="8" width="174" height="174" fill="#000066" rx="4" ry="4" stroke="#ffdf33" stroke-width="2"/>
    <!-- Decorative inner golden flourish -->
    <path d="M 40 140 C 60 20, 130 20, 150 140 C 170 200, 20 200, 40 140 Z" fill="url(#gold)" opacity="0.9"/>
    <path d="M 50 135 C 65 40, 125 40, 140 135 C 155 180, 35 180, 50 135 Z" fill="#8b0000" />
  </g>

  <!-- Ornate Flowing Vines & Leaves -->
  <path d="M 320 120 Q 400 60 550 140 T 700 120" fill="none" stroke="#228b22" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 100 350 C 50 450, 150 550, 100 700 S 150 800, 120 880" fill="none" stroke="#228b22" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Vine Berries/Flowers -->
  <circle cx="400" cy="110" r="7" fill="#8b0000" stroke="url(#gold)" stroke-width="1.5"/>
  <circle cx="600" cy="130" r="7" fill="url(#gold)" />
  <circle cx="90" cy="400" r="7" fill="url(#gold)" />
  <circle cx="120" cy="620" r="7" fill="#8b0000" stroke="url(#gold)" stroke-width="1.5"/>
  <circle cx="90" cy="800" r="7" fill="url(#gold)" />
</svg>