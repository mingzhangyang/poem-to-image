name: Temporary dependency lock refresh

on:
  push:
    branches: [fix/inkpoem-localization-export-20261024]
    paths: [.github/workflows/temporary-lock-refresh.yml]

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate and fix compatible dependencies
        run: |
          npm install --package-lock-only --ignore-scripts --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          git diff --check
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh security-patched dependency lockfile"
            git push origin HEAD:fix/inkpoem-localization-export-20261024
          fi
