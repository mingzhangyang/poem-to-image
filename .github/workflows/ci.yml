name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run cf:typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      # Worker HTML routing tests need the actual SPA assets from dist/.
      - run: npm run build
      - run: npm run test:worker
      - run: npm run verify:build
      - run: npm run deploy:dry-run
      - run: npm run audit:production
      - run: npm run audit:full

  browser-smoke:
    runs-on: ubuntu-latest
    # Chromium and its Linux dependencies are bundled to avoid apt mirror/DNS failures.
    # Keep this version in sync with the package-lock.json Playwright version.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --user 1001
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run test:e2e
