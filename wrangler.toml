name = "poem-to-image"
main = "worker/index.ts"
compatibility_date = "2026-03-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# D1 database binding (run `wrangler d1 create poem-to-image` to create, then fill in database_id)
[[d1_databases]]
binding = "DB"
database_name = "poem-to-image"
database_id = "995b0467-4d5c-4762-b9a4-14793af88349"
